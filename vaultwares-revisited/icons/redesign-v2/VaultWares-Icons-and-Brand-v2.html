<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VaultWares — Icons & Brand Kit v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      /* ── Console Mode ──────────────────────────────────── */
      --vault-console-bg: #161320;
      --vault-console-surface: #1F1A2B;
      --vault-console-raised: #2A2340;
      --vault-console-elevated: #31274A;
      --vault-console-border-subtle: rgba(255, 255, 255, 0.06);
      --vault-console-text-secondary: rgba(237, 230, 255, 0.72);
      --vault-console-gold: #D6A441;
      --vault-console-violet: #9A7BBF;
      --vault-console-accent: #C0785E;

      /* ── Warm Mode ─────────────────────────────────────── */
      --vault-warm-bg: #F5F1E8;
      --vault-warm-raised: #FCFAF5;
      --vault-warm-muted: #ECE5D8;
      --vault-warm-border-subtle: rgba(22, 19, 32, 0.08);

      /* ── Signal Palette (Muted) ────────────────────────── */
      --vault-signal-online:  #5DB866;
      --vault-signal-relay:   #C0785E;
      --vault-signal-sync:    #9A7BBF;
      --vault-signal-warning: #CFA444;
      --vault-signal-alert:   #CF5F6B;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--vault-console-bg);
      color: var(--vault-console-text-secondary);
    }

    #root { width: 100%; min-height: 100vh; }

    /* ── Subtle LED Pulse ────────────────────────────────── */
    @keyframes ledPulse {
      0%   { opacity: 0.65; }
      50%  { opacity: 1; }
      100% { opacity: 0.65; }
    }

    /* ── Scrollbar ───────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: var(--vault-console-raised); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--vault-console-gold); }
    html { scrollbar-color: var(--vault-console-raised) #000; }

    button { font-family: inherit; }
    svg { display: block; }
  </style>
<link id="gfont-Roboto" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&amp;display=swap">
<link id="gfont-Inter" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="vw-icons.jsx"></script>
  <script type="text/babel" src="vw-brand.jsx"></script>
  <script type="text/babel" src="vw-player.jsx"></script>
  <script type="text/babel" src="vw-chart.jsx"></script>
  <script type="text/babel" src="vw-app.jsx"></script>

  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<VWShowcaseApp />);
  </script>
</body>
</html>
